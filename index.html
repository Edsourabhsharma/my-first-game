<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coin Collector</title>
  <style>
    body { 
      margin: 0; 
      background: #1e1e2e; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      color: #fff; 
      font-family: sans-serif;
      touch-action: manipulation;
    }
    canvas { 
      background: #181825; 
      border: 3px solid #cdd6f4; 
      max-width: 95vw; 
      max-height: 55vh; 
    }
    
    /* Touch D-Pad Styles */
    .controls {
      display: grid;
      grid-template-areas: 
        ". up ."
        "left . right"
        ". down .";
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: #313244;
      border: 2px solid #cdd6f4;
      border-radius: 12px;
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn:active { background: #45475a; }
    .btn-up { grid-area: up; }
    .btn-down { grid-area: down; }
    .btn-left { grid-area: left; }
    .btn-right { grid-area: right; }
  </style>
</head>
<body>
  <h2>Use Arrow Keys or Touch Pad to Collect Gold Coins</h2>
  <canvas id="gameCanvas" width="800" height="600"></canvas>

  <!-- Touch D-Pad for Mobile -->
  <div class="controls">
    <div class="btn btn-up" id="btn-up">▲</div>
    <div class="btn btn-left" id="btn-left">◀</div>
    <div class="btn btn-right" id="btn-right">▶</div>
    <div class="btn btn-down" id="btn-down">▼</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
